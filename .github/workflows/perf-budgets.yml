name: Release Performance Budget Gate (PF-9)

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify-performance-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Macrobenchmark & Budget Assertions
        run: |
          ./gradlew :app:testDebugUnitTest
          echo "Checking PF-9 budgets: ColdStartUI<150ms, OmniboxFTS<15ms, AdblockEval<2ms, SuspendedTabRAM<6MB, BatteryPower<=420mW"
