name: Build Android APK (Firebase Enabled)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore Firebase google-services.json from Secret (if configured)
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > app/google-services.json
      - name: Assemble Debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Optional: Distribute APK to testers via Firebase App Distribution
      # - name: Upload to Firebase App Distribution
      #   uses: wzieba/Firebase-Distribution-Github-Action@v1
